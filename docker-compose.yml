version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: carbooking-postgres
    environment:
      POSTGRES_DB: carbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - carbooking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  carbooking_pgdata:
