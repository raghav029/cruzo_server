server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carbooking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-now}
    expiration-ms: 86400000
    issuer: carbooking-platform

  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    sender-id: CARBKG
    base-url: https://api.msg91.com/api/v5

  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
      distance-matrix-url: https://maps.googleapis.com/maps/api/distancematrix/json

  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET:carbooking-invoices}
      region: ${AWS_REGION:ap-south-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.carbooking: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
